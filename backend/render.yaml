services:
  - type: web
    name: emotion-engine-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: ORT_LIB_PATH
        value: ./libonnxruntime.so.1.21.0
    healthCheckPath: /api/v1/health

  - type: web
    name: emotion-engine-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://emotion-engine-api.onrender.com
